name: Build 3D Contributions

on:
  schedule:
    - cron: "17 1 * * *"   # rebuild the 3D contribution graph daily
  workflow_dispatch:        # allows manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: profile-3d
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Render the 3D contribution SVG
        env:
          GH_USER: ${{ github.repository_owner }}
        run: node scripts/generate-3d-contrib.mjs

      - name: Commit the SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          git diff --staged --quiet || git commit -m "chore: rebuild 3D contribution graph"
          git push
