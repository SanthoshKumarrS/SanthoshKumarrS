name: Update Star Count

on:
  schedule:
    - cron: "43 2 * * *"   # refresh the total star count daily
  workflow_dispatch:        # allows manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: star-count
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sum stars and rewrite the README block
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: node scripts/update-star-count.mjs

      - name: Commit the README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update total star count"
          git push
