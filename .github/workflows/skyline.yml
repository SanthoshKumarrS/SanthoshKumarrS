name: Build Contribution City

on:
  schedule:
    - cron: "0 0 * * *"   # rebuild the skyline daily at midnight UTC
  workflow_dispatch:       # allows manual runs from the Actions tab
  push:
    branches: [main]       # rebuild when the repo is updated

permissions:
  contents: write

concurrency:
  group: contribution-city
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Render the skyline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: SanthoshKumarrS
        run: node scripts/generate-skyline.mjs

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
