name: 3D Contribution Graph

# NOTE: this file must live in .github/workflows/ — GitHub ignores workflows
# placed directly in .github/, which is why the graph never refreshed before.

on:
  schedule:
    - cron: "17 15 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-3d-contrib
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # GH_USER is derived from the repo owner, so the graph can only ever
      # render this account's calendar.
      - name: Render contribution skyline
        env:
          GH_USER: ${{ github.repository_owner }}
        run: node scripts/generate-3d-contrib.mjs

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --cached --quiet || git commit -m "chore: refresh 3d contribution graph"
          git push
